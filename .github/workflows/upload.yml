name: Jazz Lo-Fi Radio Auto Upload

on:
  schedule:
    - cron: '0 6 * * *'    # 11:00 KZ
  workflow_dispatch:        # Қолмен іске қосу үшін

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Код жүктеу
        uses: actions/checkout@v4

      - name: Python орнату
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg орнату
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Python кітапханаларын орнату
        run: pip install --quiet -r requirements.txt

      - name: Құпия файлдарды дайындау
        env:
          JAZZ_CLIENT_SECRETS_JSON: ${{ secrets.JAZZ_CLIENT_SECRETS_JSON }}
          JAZZ_YOUTUBE_TOKEN_JSON: ${{ secrets.JAZZ_YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$JAZZ_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$JAZZ_YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: .env файлын жасау
        run: |
          cat > .env << 'EOF'
          PEXELS_API_KEY=${{ secrets.JAZZ_PEXELS_API_KEY }}
          TELEGRAM_NOTIFY_TOKEN=${{ secrets.JAZZ_TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID=${{ secrets.JAZZ_TELEGRAM_NOTIFY_CHAT_ID }}
          JAZZ_MIN_MINUTES=70
          JAZZ_MAX_MINUTES=110
          YOUTUBE_CATEGORY_ID=10
          YOUTUBE_PRIVACY_STATUS=public
          YOUTUBE_MADE_FOR_KIDS=false
          MAX_RETRIES=3
          RETRY_DELAY=2
          EOF

      - name: Видео жасап YouTube-ке жүктеу
        run: python -c "from jazz_video_gen import generate_video; generate_video()"
